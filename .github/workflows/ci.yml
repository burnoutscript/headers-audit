name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes
        run: pytest -v

      - name: Verificação de ponta a ponta nos dumps de exemplo
        run: |
          headers-audit --from-file samples/site_blindado.txt --url http://app.example.com/ --no-color
          status=0
          headers-audit --from-file samples/site_fraco.txt --format json > /dev/null || status=$?
          test "$status" -eq 1
